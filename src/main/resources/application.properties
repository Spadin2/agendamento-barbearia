spring.application.name=agendafacil

# Servidor (PORT e opcional; padrao 8080)
server.port=${PORT:8080}

# Banco de dados: valores vem de variaveis de ambiente, nunca fixos aqui
# Exemplo de DB_URL: jdbc:mysql://localhost:3306/agendafacil
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# O schema e criado pelo schema.sql (nao pelo Hibernate).
# "none" porque o validate costuma reclamar das colunas ENUM do MySQL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Sessao
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
